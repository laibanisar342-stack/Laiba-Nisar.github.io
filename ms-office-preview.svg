    <text x="380" y="191" fill="#7CFFB2">Completed</text>
    <text x="540" y="191">06/10/2026</text>

    <rect x="64" y="206" width="672" height="40" fill="#171C2B"/>
    <text x="84" y="231">Onboarding checklist (template)</text>
    <text x="380" y="231" fill="#FFD27C">In Progress</text>
    <text x="540" y="231">06/14/2026</text>

    <rect x="64" y="246" width="672" height="40" fill="#1B2233"/>
    <text x="84" y="271">Candidate data — mail merge</text>
    <text x="380" y="271" fill="#FF8C7C">Pending</text>
    <text x="540" y="271">06/18/2026</text>

    <rect x="64" y="286" width="672" height="40" fill="#171C2B"/>
    <text x="84" y="311">Monthly summary slides (PPT)</text>
    <text x="380" y="311" fill="#FFD27C">In Progress</text>
    <text x="540" y="311">06/20/2026</text>
  </g>

  <!-- simple bar chart -->
  <text x="64" y="365" font-family="Arial" font-size="14" fill="#93A0B8">Weekly Completion Overview</text>
  <g>
    <rect x="64" y="420" width="60" height="60" fill="url(#g1)" rx="4"/>
    <rect x="150" y="390" width="60" height="90" fill="url(#g1)" rx="4"/>
    <rect x="236" y="440" width="60" height="40" fill="url(#g1)" rx="4"/>
    <rect x="322" y="400" width="60" height="80" fill="url(#g1)" rx="4"/>
    <rect x="408" y="370" width="60" height="110" fill="url(#g1)" rx="4"/>
  </g>
  <g font-family="Arial" font-size="12" fill="#93A0B8">
    <text x="78" y="495">Wk1</text>
    <text x="164" y="495">Wk2</text>
    <text x="250" y="495">Wk3</text>
    <text x="336" y="495">Wk4</text>
    <text x="422" y="495">Wk5</text>
  </g>

  <text x="500" y="495" font-family="Arial" font-size="13" fill="#7C9CFF">Built with Excel formulas + charts, Word templates &amp; PowerPoint reports</text>
