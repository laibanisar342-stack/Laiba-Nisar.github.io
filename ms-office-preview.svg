<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C9CFF"/>
      <stop offset="1" stop-color="#B07CFF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="#0F1320"/>
  <rect x="40" y="40" width="720" height="480" rx="14" fill="#171C2B" stroke="#2A3146"/>

  <!-- header bar -->
  <rect x="40" y="40" width="720" height="64" rx="14" fill="url(#g1)"/>
  <text x="64" y="80" font-family="Arial" font-size="22" fill="#0F1320" font-weight="700">Internship Progress Report — Excel Tracker</text>

  <!-- table header -->
  <rect x="64" y="130" width="672" height="36" rx="6" fill="#232A40"/>
  <text x="84" y="154" font-family="Arial" font-size="14" fill="#AFC0FF" font-weight="700">Task</text>
  <text x="380" y="154" font-family="Arial" font-size="14" fill="#AFC0FF" font-weight="700">Status</text>
  <text x="540" y="154" font-family="Arial" font-size="14" fill="#AFC0FF" font-weight="700">Due Date</text>

  <!-- rows -->
  <g font-family="Arial" font-size="14" fill="#E8ECF6">
    <rect x="64" y="166" width="672" height="40" fill="#1B2233"/>
